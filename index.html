<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Joey Ong — Business Growth Partner · Event Strategist · Host</title>
<meta name="description" content="Helping businesses grow, brands come to life, and people lead with confidence." />
<meta name="theme-color" content="#B5533A" />

<!-- Social share preview -->
<meta property="og:title" content="Joey Ong — Business Growth Partner · Event Strategist · Host" />
<meta property="og:description" content="Helping businesses grow, brands come to life, and people lead with confidence." />
<meta property="og:image" content="joey.jpg" />
<meta property="og:type" content="profile" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<script>
const CONTENT = {
  // ---- HERO ----
  name: "Joey Ong",
  role: "Business Growth Partner · Event Strategist · Host",
  positioning: "Helping businesses grow, brands come to life, and people lead with confidence.",
  photo: "joey.jpg",

  // words that scroll across the moving ticker under the hero
  marquee: ["Events", "Speaking", "Business Growth", "Hosting", "Community", "Becoming"],

  // ---- WhatsApp + Email (used across the page) ----
  whatsapp: {
    number: "60103938943",                              // country code + number, no + or spaces
    greeting: "Hi Joey, I found you through your page — "
  },
  email: "joeyee.jo@gmail.com",

  // ---- THE MAIN CARDS ----  (set show:false to hide one)
  cards: [
    {
      show: true,
      emoji: "🚀",
      title: "Scale Your Business",
      blurb: "Courses, coaching and community for young, growth-focused business leaders — through Owners Circle Academy.",
      cta: "Explore Business Growth",
      url: "https://linktr.ee/ownerscircleacademy"
    },
    {
      show: true,
      emoji: "🎪",
      title: "Bring Your Event to Life",
      blurb: "From roadshows to any event — we build experiences your audiences walk right into.",
      cta: "Plan Your Event",
      url: "https://jvish.my/"
    },
    {
      show: true,
      emoji: "🎤",
      title: "Engage & Inspire",
      blurb: "Host, emcee or trainer — Joey brings the energy and clarity that carries a room, from a training room to the main stage.",
      cta: "See Joey on Stage",
      url: "https://canva.link/joeyongvoice"
    }
  ],

  // ---- FOLLOW JOEY ----  (set a social's show:true and paste its url to switch it on)
  follow: {
    show: true,
    heading: "Follow the Journey",
    blurb: "The real journey — business, growth, and the lessons in between.",
    socials: [
      { id: "instagram", show: true,  label: "Instagram", url: "https://www.instagram.com/byjoeyong/" },
      { id: "linkedin",  show: true,  label: "LinkedIn",  url: "https://www.linkedin.com/in/ongjoey/" },
      { id: "facebook",  show: false, label: "Facebook",  url: "" },
      { id: "tiktok",    show: false, label: "TikTok",    url: "" },
      { id: "youtube",   show: false, label: "YouTube",   url: "" }
    ]
  },

  // ---- CONTACT ----
  contact: {
    show: true,
    heading: "Let’s talk",
    blurb: "Have something in mind? The fastest way to reach Joey is right here."
  },

  // ---- TRUST STRIP ----  (flip show:true and fill the line when ready)
  trust: {
    show: false,
    line: ""                                             // e.g. "150+ events delivered · 8 years in the industry"
  },

  // ---- FOOTER ----
  footer: {
    tagline: "Building experiences that grow businesses — and the people behind them."
  }
};
</script>

<!--   ⛔  Don't edit below this line (that's the design + code)    -->
<!-- ============================================================ -->

<style>
  :root{
    --cream:#F5EFE6; --ink:#241F1B; --clay:#B5533A; --clayDark:#9A4530;
    --gold:#C0873B; --rose:#C17A66; --sand:#E7DBC8; --muted:#7C726A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{position:relative;overflow-x:hidden}
  .disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
  a{text-decoration:none;color:inherit}
  main{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:0 0 56px}

  /* ---------- HERO — bold colour block ---------- */
  .hero{position:relative;overflow:hidden;padding:42px 22px 76px;text-align:center;color:#F8EFE4;
    background:radial-gradient(120% 90% at 50% 0%, #C56742 0%, #B5533A 42%, #8E4230 100%)}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:36px;background:var(--cream);
    border-radius:50% 50% 0 0/100% 100% 0 0}
  .badge{display:inline-flex;gap:8px;align-items:center;padding:7px 15px;border-radius:9999px;
    background:rgba(248,239,228,.16);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    position:relative;z-index:1}
  .photo-wrap{margin:20px auto 0;width:136px;height:136px;border-radius:9999px;padding:5px;
    background:rgba(248,239,228,.24);box-shadow:0 16px 40px rgba(0,0,0,.25);position:relative;z-index:1}
  .photo-wrap img{width:100%;height:100%;border-radius:9999px;object-fit:cover;object-position:60% 26%}
  .name{margin-top:16px;font-size:58px;line-height:.9;letter-spacing:-.03em;font-weight:800;position:relative;z-index:1}
  @media(min-width:560px){.name{font-size:66px}}
  .tagline{margin:14px auto 0;max-width:22rem;font-size:15.5px;line-height:1.5;color:rgba(248,239,228,.88);position:relative;z-index:1}
  .socials{margin-top:18px;display:flex;justify-content:center;gap:9px;position:relative;z-index:1}
  .s-btn{display:flex;width:42px;height:42px;align-items:center;justify-content:center;border-radius:50%;
    background:rgba(248,239,228,.16);color:#F8EFE4;transition:.2s}
  .s-btn:hover{background:#F8EFE4;color:var(--clay);transform:translateY(-3px)}
  .cta{margin-top:18px;display:inline-flex;align-items:center;gap:9px;border-radius:9999px;padding:14px 28px;
    font-size:14.5px;font-weight:700;color:var(--clay);background:#F8EFE4;position:relative;z-index:1;
    box-shadow:0 12px 28px rgba(0,0,0,.22);transition:.2s}
  .cta:hover{transform:translateY(-3px)}

  /* ---------- MARQUEE ---------- */
  .marquee{overflow:hidden;background:var(--ink);color:var(--cream);padding:12px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .marquee-track{display:inline-flex;white-space:nowrap;animation:scroll 20s linear infinite;
    font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
  .marquee-track span{padding:0 10px}
  .marquee-track span::after{content:"●";margin-left:20px;color:var(--gold);font-size:9px;vertical-align:middle}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media(prefers-reduced-motion:reduce){.marquee-track{animation:none}}

  .wrap{padding:0 20px}
  .label{display:flex;align-items:center;gap:14px;margin:30px 2px 18px;color:var(--muted)}
  .label span{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
  .label::before,.label::after{content:"";flex:1;height:2px;background:var(--sand)}

  /* ---------- CARDS — bold solid colour blocks ---------- */
  .cards{display:flex;flex-direction:column;gap:14px}
  .card{position:relative;display:block;border-radius:22px;padding:24px 22px;overflow:hidden;color:#fff;
    background:var(--accent);box-shadow:0 12px 30px rgba(36,31,27,.14);transition:transform .24s,box-shadow .24s}
  .card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 18px 40px rgba(36,31,27,.2)}
  .c-num{position:absolute;top:14px;right:20px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;color:#fff;opacity:.28}
  .c-row{display:flex;gap:15px;align-items:flex-start}
  .c-emoji{flex:0 0 auto;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    border-radius:15px;background:rgba(255,255,255,.2);font-size:26px}
  .c-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:23px;line-height:1.06;padding-right:26px}
  .c-blurb{margin-top:8px;font-size:13.8px;line-height:1.55;color:rgba(255,255,255,.92)}
  .c-cta{margin-top:14px;display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700}
  .c-arrow{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:50%;
    background:rgba(255,255,255,.22);transition:.2s}
  .card:hover .c-arrow{background:#fff;color:var(--accent);transform:translateX(3px)}

  /* ---------- TRUST ---------- */
  .trust{margin-top:22px;text-align:center;font-size:12.5px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  /* ---------- BANDS ---------- */
  .band{border-radius:22px;padding:30px 22px;text-align:center}
  .band-follow{background:var(--ink);color:var(--cream)}
  .band-contact{margin-top:14px;background:#fff;border:2px solid var(--sand)}
  .band h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px}
  .band-follow p{margin:8px auto 0;max-width:20rem;font-size:13.8px;line-height:1.6;color:rgba(245,239,230,.72)}
  .band-contact p{margin:8px auto 0;max-width:20rem;font-size:13.8px;line-height:1.6;color:var(--muted)}
  .pills{margin-top:16px;display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
  .pill{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;border:1px solid rgba(245,239,230,.24);
    background:rgba(245,239,230,.06);padding:9px 16px;font-size:13.5px;font-weight:500;color:var(--cream);transition:.2s}
  .pill:hover{background:var(--cream);color:var(--ink);transform:translateY(-2px)}
  .cbtns{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  @media(min-width:560px){.cbtns{flex-direction:row;justify-content:center}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:9999px;padding:13px 26px;font-size:14px;font-weight:700;transition:.2s}
  .btn-wa{background:var(--clay);color:#fff;box-shadow:0 10px 24px rgba(181,83,58,.28)}
  .btn-wa:hover{background:var(--clayDark);transform:translateY(-3px)}
  .btn-mail{border:2px solid var(--sand);background:var(--cream);color:var(--ink)}
  .btn-mail:hover{border-color:var(--clay);color:var(--clay);transform:translateY(-3px)}

  /* ---------- FOOTER ---------- */
  footer{margin-top:44px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
  .f-ic{display:flex;gap:10px}
  .f-ic a{display:flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:50%;color:var(--muted);transition:.2s}
  .f-ic a:hover{color:var(--clay);transform:translateY(-2px)}
  .f-tag{max-width:20rem;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:16px;color:var(--muted)}
  .f-cp{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(124,114,106,.7)}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ---------- inline SVG icons ---------- */
const ICONS = {
  instagram:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  linkedin:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0-.02-5ZM3 9h4v12H3V9Zm6 0h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.4 8.65 21 11 21 14.1V21h-4v-6.1c0-1.45-.03-3.32-2.02-3.32-2.02 0-2.33 1.58-2.33 3.21V21H9V9Z"/></svg>',
  facebook:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H7v3h3v6h3v-6h3l1-3h-4v-2c0-.6.4-1 1-1Z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 3c.3 2.2 1.7 3.9 4 4.2v3c-1.5 0-2.9-.5-4-1.3v6.3A6.2 6.2 0 1 1 9.8 9v3.1a3.1 3.1 0 1 0 3.2 3.1V3H16Z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M23 12s0-3.2-.4-4.7c-.2-.9-.9-1.5-1.7-1.7C19.4 5.2 12 5.2 12 5.2s-7.4 0-8.9.4c-.8.2-1.5.8-1.7 1.7C1 8.8 1 12 1 12s0 3.2.4 4.7c.2.9.9 1.5 1.7 1.7 1.5.4 8.9.4 8.9.4s7.4 0 8.9-.4c.8-.2 1.5-.8 1.7-1.7.4-1.5.4-4.7.4-4.7ZM10 15V9l5 3-5 3Z"/></svg>',
  whatsapp:'<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.9.9-2.8-.2-.3A8 8 0 1 1 12 20Zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.7.9-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-1.9-1.2 7.3 7.3 0 0 1-1.4-1.7c-.1-.2 0-.4.1-.5l.4-.4c.1-.2.2-.3.2-.5s0-.4-.1-.5c0-.1-.5-1.3-.7-1.8-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3-.2.2-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.2.7 3 .6.5 0 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1-.1-.1-.2-.2-.5-.3Z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

/* warm accent colour per card */
const TINTS = ["#B5533A", "#C0873B", "#C17A66"]; // clay, gold, rose

const esc = (s)=>String(s).replace(/[&<>"]/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function waLink(wa){ return `https://wa.me/${wa.number}?text=${encodeURIComponent(wa.greeting||"")}`; }

(function render(){
  const c = CONTENT;
  const wa = waLink(c.whatsapp);
  const socials = c.follow.socials.filter(s=>s.show && s.url);
  const cards = c.cards.filter(x=>x.show);

  const socialBtns = socials.map(s=>`<a class="s-btn" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(s.label)}">${ICONS[s.id]||s.label[0]}</a>`).join("");

  const marqueeWords = (c.marquee && c.marquee.length ? c.marquee : [c.role]);
  const marqueeItems = marqueeWords.concat(marqueeWords).map(m=>`<span>${esc(m)}</span>`).join("");

  const cardsHtml = cards.map((card,i)=>{
    const accent = TINTS[i % TINTS.length];
    const n = String(i+1).padStart(2,"0");
    return `<a class="card" style="--accent:${accent}" href="${esc(card.url)}" target="_blank" rel="noopener noreferrer">
      <span class="c-num">${n}</span>
      <div class="c-row">
        <div class="c-emoji">${card.emoji}</div>
        <div style="min-width:0;flex:1">
          <div class="c-title">${esc(card.title)}</div>
          <div class="c-blurb">${esc(card.blurb)}</div>
          <span class="c-cta">${esc(card.cta)} <span class="c-arrow">${ICONS.arrow}</span></span>
        </div>
      </div></a>`;
  }).join("");

  const trust = (c.trust.show && c.trust.line) ? `<p class="trust">${esc(c.trust.line)}</p>` : "";

  const followBand = (c.follow.show && socials.length) ? `<section class="band band-follow">
      <h2>${esc(c.follow.heading)}</h2>
      <p>${esc(c.follow.blurb)}</p>
      <div class="pills">${socials.map(s=>`<a class="pill" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${ICONS[s.id]||""} ${esc(s.label)}</a>`).join("")}</div>
    </section>` : "";

  const contactBand = c.contact.show ? `<section class="band band-contact">
      <h2>${esc(c.contact.heading)}</h2>
      <p>${esc(c.contact.blurb)}</p>
      <div class="cbtns">
        <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener noreferrer">${ICONS.whatsapp} WhatsApp</a>
        <a class="btn btn-mail" href="mailto:${esc(c.email)}">${ICONS.mail} Email</a>
      </div>
    </section>` : "";

  document.getElementById("app").innerHTML = `
    <header class="hero">
      <span class="badge">${esc(c.role)}</span>
      <div class="photo-wrap"><img src="${esc(c.photo)}" alt="${esc(c.name)}"></div>
      <h1 class="name disp">${esc(c.name)}</h1>
      <p class="tagline">${esc(c.positioning)}</p>
      ${socialBtns ? `<div class="socials">${socialBtns}</div>` : ""}
      <a class="cta" href="${wa}" target="_blank" rel="noopener noreferrer">${ICONS.whatsapp} Message Joey</a>
    </header>

    <div class="marquee"><div class="marquee-track">${marqueeItems}</div></div>

    <div class="wrap">
      <div class="label"><span>What Joey Does</span></div>
      <section class="cards">${cardsHtml}</section>
      ${trust}
      <div class="label"><span>Stay Connected</span></div>
      ${followBand}
      ${contactBand}
      <footer>
        <div class="f-ic">${socials.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(s.label)}">${ICONS[s.id]||s.label[0]}</a>`).join("")}</div>
        <p class="f-tag">${esc(c.footer.tagline)}</p>
        <p class="f-cp">© ${esc(c.name)}</p>
      </footer>
    </div>`;
  document.title = `${c.name} — ${c.role}`;
})();
</script>
</body>
</html>
